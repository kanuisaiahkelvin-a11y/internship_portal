databases:
  - name: internlink-db
    plan: free
    databaseName: internlink
    user: internlink

services:
  - type: web
    name: internlink
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    initialDeployHook: python manage.py bootstrap --seed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: internlink-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@internlink.test
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_FIRST_NAME
        value: Portal
      - key: DJANGO_SUPERUSER_LAST_NAME
        value: Admin
