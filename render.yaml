databases:
  - name: internlink-db
    plan: free
    databaseName: internlink
    user: internlink

services:
  - type: web
    name: internlink
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: internlink-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: WEB_CONCURRENCY
        value: "2"
